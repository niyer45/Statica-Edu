# CI_Pipeline (Requirements 1.3, 1.4, 1.9, 33.6, 33.10).
# A single job with sequential steps: any non-zero step fails the run and
# skips every later step, so the failing step is the one marked red.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build, schema, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the version from package.json "packageManager" (pnpm@10.34.3),
      # which matches the pin in .mise.toml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Report only: never blocks the pipeline.
      - name: Audit production dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --prod

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and property tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Fails if the committed schema differs from the generated one,
      # including a newly generated file that was never committed.
      - name: Schema drift check
        run: |
          pnpm run gen:schema
          git diff --exit-code -- schemas/
          untracked="$(git ls-files --others --exclude-standard -- schemas/)"
          if [ -n "$untracked" ]; then
            echo "::error::Uncommitted generated schema files:"
            echo "$untracked"
            exit 1
          fi

      # Both Playwright projects (Desktop Chrome and Pixel 7) use Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
